<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Form</title>
  <link rel="stylesheet" href="CFtest_master.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="CFtest_data.js"></script>
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme=dark>
    <div class="container-fluid">
      <a class="navbar-brand" href="first_website.html">Matthaus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-link" href="Sign_up_form.html">Sign-up!</a>
          <a class="nav-link" href="#">Your Details</a>
          <a class="nav-link disabled" aria-disabled="true">Disabled</a>
        </div>
      </div>
    </div>
  </nav>



  <div>
    <h1 class="title">Members Details</h1>
    <h5>Please fill in all required fields below:</h5>
  </div>
  <form>


    <table>
      <div>
        <tr>
          <td><label for="customerName" class="form-label">Name:</label></td>
          <td><input type="text" id="customerName" name="customerName" placeholder="Enter Name" class="form-control"
              required></td>
        </tr>

        <tr>
          <td><label for="customerSurname" class="form-label">Surname:</label></td>
          <td><input type="text" id="customerSurname" name="customerSurname" placeholder="Enter Surname"
              class="form-control" required></td>
        </tr>

        <tr>
          <td><label for="customerAge" class="form-label">Age:</label></td>
          <td><input type="number" id="customerAge" name="customerAge" min="1" max="120" placeholder="Age"
              class="form-control" required></td>
        </tr>

        <tr>
          <td><label for="customerDob" class="form-label">Date of Birth:</label></td>
          <td><input type="date" id="customerDob" name="customerDob" class="form-control" required></td>
        </tr>

        <tr>
          <td><label for="customerGender" class="form-label">Gender:</label></td>
          <td>
            <select name="customerGender" id="customerGender" class="form-control" aria-label="Default select example"
              required>
              <option selected>Pick an Option</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="customerNumber" class="form-label">Contact Number:</label></td>
          <td><input type="tel" id="customerNumber" name="customerNumber" placeholder="Contact Number"
              class="form-control" required></td>
        </tr>

        <tr>
          <td><label for="customerEmail" class="form-label">Email:</label></td>
          <td><input type="email" id="customerEmail" name="customerEmail" placeholder="name@email.com"
              class="form-control" required></td>
        </tr>

        <tr>
          <td><label for="customerAddress" class="form-label">Address:</label></td>
          <td><input type="text" id="customerAddress" name="customerAddress" placeholder="Enter Address"
              class="form-control" required></td>
        </tr>

    </table>

    <h6>
      Check the box if you agree to the T&C's specified
      <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">here</a>.
      <input type="checkbox" class="form-check-input" value="" required>
    </h6>
    </div>

    <button class="btn btn-outline-danger" type="submit">Complete</button>

    <button class="btn btn-outline-danger" type="submit" onclick="alert('Fine! Leave!')">Return</button>


  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>

</html>
