<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-up</title>
  <link rel="stylesheet" href="Sign_up_form_master.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src=></script>
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme=dark>
    <div class="container-fluid">
      <a class="navbar-brand" href="first_website.html">Matthaus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-link" href="#">Sign-up!</a>
          <a class="nav-link" href="CFtest.html">Your Details</a>
          <a class="nav-link disabled" aria-disabled="true">Disabled</a>
        </div>
      </div>
    </div>
  </nav>


  <div class="container">
    <h1>
      Sign-up now.
    </h1>
  </div>

  <form class="container">

    <table class="container">

      <div class="container">
        <tr>
          <td><label for="CustomerName">Username:</label></td>
        </tr>
        <tr>
          <td><input type="text" name="text" id="text" placeholder="Username" class="form-control" required></td>
        </tr>
      </div>

      <div>
        <tr>
          <td> <label for="GuestEmail">Enter Email:</label></td>
        </tr>
        <tr>
          <td><input type="email" name="email" id="signUpEmail" placeholder="name@email.com" class="form-control"
              required></td>
        </tr>
      </div>

      <div>
        <tr>
          <td><label for="choosePassword">Choose a Password:</label></td>
        </tr>
        <tr>
          <td><input type="password" name="choosePassword" id="choosePassword" placeholder="Password"
              class="form-control" required></td>
        </tr>
      </div>

      <div>
        <tr>
          <td><label for="reType">Enter your password again:</label></td>
        </tr>
        <tr>
          <td><input type="password" name="reType" id="reType" placeholder="Enter your password again"
              class="form-control" required></td>
        </tr>
      </div>

      <div class="container">
        <tr>
          <td>
            <h6>
              Check the box if you agree to the T&C's specified
              <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">here</a>.
              <input type="checkbox" class="form-check-input" value="" required>
            </h6>
          </td>
        </tr>
      </div>

      <div>
        <tr>
          <td><a href="CFtest.html" class="btn btn-outline-danger" type="submit"> Click Here!</a></td>
        </tr>
      </div>

    </table>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
